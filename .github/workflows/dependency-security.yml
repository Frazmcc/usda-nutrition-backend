name: Node dependency security and build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Validate backend syntax (when present)
        shell: bash
        run: |
          if [ -f server.js ]; then node --check server.js; fi
      - name: Build
        run: npm run build --if-present
      - name: Run available tests
        run: npm test --if-present
      - name: Enforce zero known npm advisories
        run: node scripts/security-audit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
